# .github/workflows/build.yml
name: Build AiPi-PalChatV2 Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make gcc python3 python3-pip

    - name: Init submodules
      run: |
        git submodule init
        git submodule update --remote os
        git submodule update --remote toolchains/linux

    - name: Build Xiaozhi-AI firmware
      run: |
        cd project/Xiaozhi-AI
        make

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: aipi-firmware
        path: project/Xiaozhi-AI/build/ # 请根据实际编译生成的文件路径调整
